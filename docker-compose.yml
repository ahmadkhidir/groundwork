# Local development infrastructure.
#
# Provides the two managed services the production topology uses, so local behavior matches
# deployment rather than approximating it:
#   - Postgres      stands in for Neon
#   - MinIO         stands in for Cloudflare R2 (S3-compatible API)
#
# The DuckDB engine is deliberately NOT here. It runs as a local OS process, which is
# architecture.md's "implementation #1" of the Engine Provider seam — a real implementation, not a
# mock. See server/internal/engine.

services:
  postgres:
    image: postgres:18-alpine
    container_name: groundwork-postgres
    environment:
      POSTGRES_USER: groundwork
      POSTGRES_PASSWORD: groundwork
      POSTGRES_DB: groundwork
    ports:
      - "5432:5432"
    volumes:
      # Mount point is /var/lib/postgresql, NOT /var/lib/postgresql/data.
      # Postgres 18+ stores data in a version-numbered subdirectory and refuses to start when the
      # volume is mounted directly at the old data path. Mounting one level up breaks the container
      # outright, not subtly — it never becomes healthy.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # The API service and migrations both depend on this being genuinely ready, not merely
      # started — Postgres accepts connections briefly before it is able to serve them.
      test: ["CMD-SHELL", "pg_isready -U groundwork -d groundwork"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: groundwork-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: groundwork
      MINIO_ROOT_PASSWORD: groundwork-secret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket the ingest pipeline writes normalized Parquet into, then exits.
  # Without it the first upload fails against an empty MinIO with a confusing NoSuchBucket error.
  minio-init:
    image: minio/mc:latest
    container_name: groundwork-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 groundwork groundwork-secret &&
      mc mb --ignore-existing local/groundwork-datasets &&
      echo 'bucket ready'
      "

volumes:
  postgres-data:
  minio-data:
