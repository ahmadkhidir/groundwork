# Fly.io app for the Groundwork web client (Next.js).
#
# App name / region: adjust to your Fly org. `primary_region` should match the API app and the
# Neon/R2 region.
#
# CRITICAL — cookie-eligible parent domain: the browser calls the Go API directly with the
# Auth.js session cookie, so this app and the API app MUST share a parent domain, and the session
# cookie must be domain-scoped. Set the web app's COOKIE_DOMAIN (Fly secret) to the shared parent
# domain — e.g. ".groundwork.app" with this app at app.groundwork.app and the API at
# api.groundwork.app. See web/src/auth.ts and IMPLEMENTATION.md §8.
#
# Secrets (NEVER in this file): `fly secrets set` on this app — AUTH_SECRET (the SAME byte-
# identical value as the API app; a mismatch rejects every signed-in request), and COOKIE_DOMAIN
# (the shared parent domain, leading dot included, required for the cross-subdomain cookie).
app = "groundwork-web"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    # Baked into the client bundle at build time. Change these by redeploying, not by setting
    # runtime env.
    NEXT_PUBLIC_API_BASE_URL = "https://api.groundwork.app"
    NEXT_PUBLIC_MAX_UPLOAD_BYTES = "524288000"
    NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY = "pk_test_xxx"

[env]
  AUTH_URL = "https://app.groundwork.app"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 80
